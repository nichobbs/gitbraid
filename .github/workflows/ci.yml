name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run compile

      # VS Code integration tests need a virtual display on Linux.
      - name: Test (Linux, headless)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'

      - name: Test (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gitbraid-vsix
          path: '*.vsix'
          if-no-files-found: warn
