name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-runs from the Actions tab — useful for flaky first-time
  # baselines on macOS / Windows runners.
  workflow_dispatch:

# Cancel older in-progress runs on the same ref so a quick succession of
# pushes doesn't waste CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege — the workflow only needs to read the repo
# and upload artefacts, nothing else.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run compile

      # VS Code integration tests need a virtual display on Linux.
      - name: Test (Linux, headless)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'

      - name: Test (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      # Coverage floor (Linux only — macOS / Windows share the same code
      # coverage as Linux so there's no value in running this three times).
      # Thresholds intentionally left conservative for 0.1; they should be
      # ratcheted up as the test suite grows.  Failures are blocking.
      - name: Check coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/check-coverage.mjs \
            --lines 55 \
            --branches 45 \
            --functions 55 \
            artifacts/lcov.info

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gitbraid-vsix
          path: '*.vsix'
          if-no-files-found: warn

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: gitbraid-coverage
          path: artifacts/lcov.info
          if-no-files-found: warn
