<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Assign a file to a branch</title>
  <desc id="desc">A file explorer entry shows a coloured tag indicating the branch the file is assigned to.</desc>

  <defs>
    <style>
      .panel { fill: #252526; stroke: #3c3c3c; stroke-width: 1; }
      .title { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 13px; font-weight: 600; }
      .subtitle { fill: #9d9d9d; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .file { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .faint { fill: #6a6a6a; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 11px; }
      .assigned { fill: #4ec9b0; }
      .floating { fill: #d7ba7d; }
    </style>
  </defs>

  <rect width="640" height="360" fill="#1e1e1e"/>

  <!-- Explorer panel -->
  <rect x="0" y="0" width="260" height="360" fill="#252526"/>
  <text x="18" y="32" class="title">EXPLORER</text>

  <!-- File rows -->
  <g font-family="-apple-system, Segoe UI, Ubuntu, sans-serif">
    <rect x="10" y="50" width="240" height="28" rx="3" fill="#2a2d2e" class="panel"/>
    <rect x="22" y="62" width="12" height="4" rx="1" class="assigned"/>
    <text x="46" y="70" class="file">README.md</text>
    <text x="240" y="70" text-anchor="end" class="faint">DO</text>

    <rect x="10" y="86" width="240" height="28" rx="3" fill="#2a2d2e" class="panel"/>
    <rect x="22" y="98" width="12" height="4" rx="1" class="assigned"/>
    <text x="46" y="106" class="file">src/foo.ts</text>
    <text x="240" y="106" text-anchor="end" class="faint">DO</text>

    <rect x="10" y="122" width="240" height="28" rx="3" fill="#2a2d2e" class="panel"/>
    <rect x="22" y="134" width="12" height="4" rx="1" class="floating"/>
    <text x="46" y="142" class="file">src/bar.ts</text>
    <text x="240" y="142" text-anchor="end" class="faint">?</text>
  </g>

  <!-- Context menu mock -->
  <rect x="160" y="110" width="220" height="96" rx="6" fill="#2d2d30" stroke="#454545"/>
  <text x="176" y="132" fill="#d7d7d7" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">Assign to branch…</text>
  <rect x="168" y="144" width="204" height="20" rx="2" fill="#094771"/>
  <text x="180" y="158" fill="#ffffff" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11">feature/docs</text>
  <text x="180" y="180" fill="#bcbcbc" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11">feature/impl</text>
  <text x="180" y="200" fill="#bcbcbc" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11">＋ new branch…</text>

  <!-- Right-pane explanation -->
  <rect x="260" y="0" width="380" height="360" fill="#1e1e1e"/>
  <text x="280" y="32" class="title">Decoration = owning branch</text>
  <text x="280" y="58" class="subtitle">Coloured bar on the left of each file</text>
  <text x="280" y="76" class="subtitle">shows which stack branch owns it.</text>
  <text x="280" y="94" class="subtitle">? marks a floating (unassigned) file.</text>

  <text x="320" y="338" text-anchor="middle" class="faint">Placeholder illustration — replace with screenshot before 1.0 (see resources/README.md)</text>
</svg>
