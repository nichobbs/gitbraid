<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Commit to a branch</title>
  <desc id="desc">The SCM panel shows one source-control group per stack branch with its own commit input.</desc>

  <defs>
    <style>
      .panel { fill: #252526; stroke: #3c3c3c; stroke-width: 1; }
      .title { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 13px; font-weight: 600; }
      .subtitle { fill: #9d9d9d; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .row { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .faint { fill: #6a6a6a; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <rect width="640" height="360" fill="#1e1e1e"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="340" height="360" fill="#252526"/>
  <text x="18" y="32" class="title">SOURCE CONTROL</text>

  <!-- GitBraid: feature/docs group -->
  <text x="18" y="62" fill="#4ec9b0" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700">GitBraid: feature/docs</text>
  <rect x="12" y="74" width="316" height="36" rx="4" fill="#2a2d2e" stroke="#3c3c3c"/>
  <text x="26" y="96" fill="#9d9d9d" font-style="italic" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12">Message for "feature/docs"…</text>
  <rect x="288" y="80" width="34" height="24" rx="3" fill="#0e639c"/>
  <text x="296" y="96" fill="#ffffff" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700">✓</text>

  <text x="18" y="132" class="faint">Changes</text>
  <text x="28" y="152" class="row">M  README.md</text>
  <text x="28" y="170" class="row">M  src/foo.ts</text>

  <!-- GitBraid: feature/impl group -->
  <text x="18" y="206" fill="#c586c0" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700">GitBraid: feature/impl</text>
  <rect x="12" y="218" width="316" height="36" rx="4" fill="#2a2d2e" stroke="#3c3c3c"/>
  <text x="26" y="240" fill="#9d9d9d" font-style="italic" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12">Message for "feature/impl"…</text>
  <rect x="288" y="224" width="34" height="24" rx="3" fill="#0e639c"/>
  <text x="296" y="240" fill="#ffffff" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700">✓</text>

  <text x="18" y="276" class="faint">Changes</text>
  <text x="28" y="296" class="row">M  src/bar.ts</text>

  <!-- Right-pane explanation -->
  <rect x="340" y="0" width="300" height="360" fill="#1e1e1e"/>
  <text x="360" y="32" class="title">One commit input per branch</text>
  <text x="360" y="58" class="subtitle">Each stack branch has its own SCM</text>
  <text x="360" y="76" class="subtitle">group. Type a message, press ✓, and</text>
  <text x="360" y="94" class="subtitle">that branch alone is committed.</text>

  <text x="320" y="338" text-anchor="middle" class="faint">Placeholder illustration — replace with screenshot before 1.0 (see resources/README.md)</text>
</svg>
