<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Add another layer</title>
  <desc id="desc">A three-branch stack where the top branch is two commits behind its parent; a Rebase now action is offered.</desc>

  <defs>
    <style>
      .panel { fill: #252526; stroke: #3c3c3c; stroke-width: 1; }
      .title { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 13px; font-weight: 600; }
      .subtitle { fill: #9d9d9d; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .branch { fill: #cccccc; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 12px; }
      .faint { fill: #6a6a6a; font-family: -apple-system, Segoe UI, Ubuntu, sans-serif; font-size: 11px; }
      .behind { fill: #d7ba7d; }
    </style>
  </defs>

  <rect width="640" height="360" fill="#1e1e1e"/>

  <!-- Stack tree -->
  <rect x="0" y="0" width="340" height="360" fill="#252526"/>
  <text x="18" y="32" class="title">BRANCH STACK</text>

  <g font-family="-apple-system, Segoe UI, Ubuntu, sans-serif">
    <rect x="12" y="50" width="316" height="30" rx="3" fill="#2a2d2e" class="panel"/>
    <circle cx="26" cy="65" r="5" fill="#4ec9b0"/>
    <text x="42" y="70" class="branch">main</text>
    <text x="316" y="70" text-anchor="end" class="faint">base</text>

    <line x1="26" y1="82" x2="26" y2="92" stroke="#6a6a6a"/>

    <rect x="12" y="92" width="316" height="30" rx="3" fill="#2a2d2e" class="panel"/>
    <circle cx="26" cy="107" r="5" fill="#c586c0"/>
    <text x="42" y="112" class="branch">feature/docs</text>
    <text x="316" y="112" text-anchor="end" class="faint">on main</text>

    <line x1="26" y1="124" x2="26" y2="134" stroke="#6a6a6a"/>

    <rect x="12" y="134" width="316" height="30" rx="3" fill="#2a2d2e" stroke="#d7ba7d"/>
    <circle cx="26" cy="149" r="5" fill="#9cdcfe"/>
    <text x="42" y="154" class="branch">feature/impl</text>
    <text x="316" y="154" text-anchor="end" class="behind">2 behind</text>
  </g>

  <!-- Notification toast -->
  <rect x="360" y="80" width="268" height="110" rx="6" fill="#2d2d30" stroke="#454545"/>
  <text x="376" y="104" fill="#d7d7d7" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">"feature/impl" is 2 commits</text>
  <text x="376" y="122" fill="#d7d7d7" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">behind "feature/docs".</text>
  <text x="376" y="142" fill="#9d9d9d" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11">Rebase now?</text>

  <rect x="376" y="152" width="84" height="26" rx="3" fill="#0e639c"/>
  <text x="418" y="170" fill="#ffffff" text-anchor="middle" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600">Rebase now</text>

  <rect x="470" y="152" width="72" height="26" rx="3" fill="#3c3c3c" stroke="#5a5a5a"/>
  <text x="506" y="170" fill="#cccccc" text-anchor="middle" font-family="-apple-system, Segoe UI, Ubuntu, sans-serif" font-size="11">Dismiss</text>

  <!-- Caption -->
  <text x="360" y="230" class="subtitle">GitBraid watches for parent-ahead</text>
  <text x="360" y="248" class="subtitle">drift and offers a one-click rebase.</text>

  <text x="320" y="338" text-anchor="middle" class="faint">Placeholder illustration — replace with screenshot before 1.0 (see resources/README.md)</text>
</svg>
